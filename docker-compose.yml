services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reelflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reelflow
    # On VPS: do NOT expose 5432 publicly (remove or bind to 127.0.0.1)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # On VPS: bound to localhost only for security
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  downloader:
    build:
      context: ./services/insta-reel-api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only accessible internally — NOT exposed to the public internet
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DOWNLOADER_API_URL: http://downloader:8080
    ports:
      - "4000:4000"
    volumes:
      - ./storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      downloader:
        condition: service_started
    env_file:
      - .env
    environment:
      # Always use the internal docker network hostname — works both locally and on VPS
      DOWNLOADER_API_URL: http://downloader:8080
    volumes:
      - ./storage:/app/storage

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # On local: http://localhost:4000
        # On VPS:   http://YOUR_SERVER_IP:4000  OR  https://api.yourdomain.com
        # Set NEXT_PUBLIC_API_URL in your .env file before building
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
